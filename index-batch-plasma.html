<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Image Plasma Textmode Renderer</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				width: 100%;
				height: 100%;
				background: #000;
				overflow: hidden;
				font-family: monospace;
			}

			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}

			.controls {
				position: fixed;
				top: 20px;
				left: 20px;
				z-index: 1000;
				background: rgba(0, 0, 0, 0.9);
				border: 2px solid #f0f;
				padding: 20px;
				border-radius: 5px;
				color: #f0f;
				font-family: monospace;
				font-size: 12px;
				max-width: 320px;
				max-height: 80vh;
				overflow-y: auto;
				box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
			}

			.controls h3 {
				margin-bottom: 15px;
				border-bottom: 1px solid #f0f;
				padding-bottom: 10px;
				text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
			}

			.image-list {
				margin: 15px 0;
				max-height: 300px;
				overflow-y: auto;
			}

			.image-item {
				padding: 8px;
				margin: 5px 0;
				background: rgba(255, 0, 255, 0.1);
				border: 1px solid #f0f;
				cursor: pointer;
				border-radius: 3px;
				transition: all 0.2s;
			}

			.image-item:hover {
				background: rgba(255, 0, 255, 0.2);
				box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
			}

			.image-item.active {
				background: rgba(255, 0, 255, 0.3);
				font-weight: bold;
				border: 1px solid #f0f;
			}

			input[type="file"] {
				margin-bottom: 10px;
				display: block;
				color: #f0f;
			}

			button {
				background: #f0f;
				color: #000;
				border: none;
				padding: 8px 16px;
				border-radius: 3px;
				cursor: pointer;
				font-weight: bold;
				margin-top: 10px;
				width: 100%;
				transition: all 0.2s;
			}

			button:hover {
				box-shadow: 0 0 10px rgba(255, 0, 255, 0.8);
				transform: scale(1.02);
			}

			.status {
				margin-top: 10px;
				padding: 8px;
				background: rgba(255, 0, 255, 0.1);
				border: 1px solid #f0f;
				border-radius: 3px;
				font-size: 10px;
			}
		</style>
	</head>
	<body>
		<div class="controls">
			<h3>Batch Plasma Renderer</h3>
			<input type="file" id="imageInput" accept="image/*" multiple>
			<button id="renderAllBtn">Render All</button>

			<div class="status" id="status">Ready...</div>

			<div class="image-list" id="imageList"></div>
		</div>

		<script src="textmode.umd.js"></script>
		<script src="script-image-plasma-batch.js"></script>

		<script>
			const imageInput = document.getElementById('imageInput');
			const renderAllBtn = document.getElementById('renderAllBtn');
			const imageList = document.getElementById('imageList');
			const statusDiv = document.getElementById('status');

			let selectedFiles = [];

			imageInput.addEventListener('change', async (e) => {
				selectedFiles = Array.from(e.target.files);
				console.log(`Selected ${selectedFiles.length} files`);
				statusDiv.textContent = `Loading ${selectedFiles.length} image(s)...`;

				// Load all images
				const imageMap = {};
				selectedFiles.forEach((file, idx) => {
					imageMap[`image_${idx}`] = URL.createObjectURL(file);
					});

					try {
						await window.BatchImagePlasmaRenderer.loadImages(imageMap);
						statusDiv.textContent = `Loaded ${selectedFiles.length} image(s)`;
						displayImageList();
						} catch (error) {
							statusDiv.textContent = `Error: ${error.message}`;
							console.error('Error loading images:', error);
							alert('Error loading images: ' + error.message);
						}
						});

						renderAllBtn.addEventListener('click', () => {
							const images = window.BatchImagePlasmaRenderer.getLoadedImages();
							if (images.length === 0) {
								statusDiv.textContent = '✗ No images loaded';
								alert('Please select and load images first');
								return;
							}
							window.BatchImagePlasmaRenderer.renderImage(images[0]);
							updateActiveImage(images[0]);
							});

							function displayImageList() {
								imageList.innerHTML = '';
								window.BatchImagePlasmaRenderer.getLoadedImages().forEach((name, idx) => {
									const div = document.createElement('div');
									div.className = 'image-item';
									div.textContent = `${selectedFiles[idx]?.name || name}`;
									div.onclick = () => {
										window.BatchImagePlasmaRenderer.renderImage(name);
										updateActiveImage(name);
										statusDiv.textContent = `▶ Rendering: ${selectedFiles[idx]?.name || name}`;
										};
										imageList.appendChild(div);
										});
									}

									function updateActiveImage(name) {
										document.querySelectorAll('.image-item').forEach(el => {
											el.classList.remove('active');
											});
											document.querySelectorAll('.image-item').forEach((el, idx) => {
												if (window.BatchImagePlasmaRenderer.getLoadedImages()[idx] === name) {
													el.classList.add('active');
												}
												});
											}
		</script>
	</body>
</html>
